# Cross compilation configuration for Windows 7 SP1 32-bit (x86 / i686)
# Targeting OBS Studio 27.2.4 (32-bit) with MinGW-w64

[binaries]
c = 'i686-w64-mingw32-gcc'
cpp = 'i686-w64-mingw32-g++'
ar = 'i686-w64-mingw32-ar'
strip = 'i686-w64-mingw32-strip'
pkg-config = 'i686-w64-mingw32-pkg-config'
windres = 'i686-w64-mingw32-windres'

[built-in options]
# Target Windows 7 SP1 (0x0601) API level
c_args = ['-D_WIN32_WINNT=0x0601', '-DWINVER=0x0601']
cpp_args = ['-D_WIN32_WINNT=0x0601', '-DWINVER=0x0601']
c_link_args = ['-static-libgcc']
cpp_link_args = ['-static-libgcc', '-static-libstdc++']

[host_machine]
system = 'windows'
cpu_family = 'x86'
cpu = 'i686'
endian = 'little'
