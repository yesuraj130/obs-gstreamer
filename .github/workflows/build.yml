name: Build obs-gstreamer (Windows 10/11 & Linux)

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  # =========================================================================
  # Target 1: Modern OBS Studio 30+/32+ (64-bit x64) for Windows 10/11
  # Native MSVC + Qt 6 Build (Enables Native Qt6 Dock in OBS Studio Menu)
  # =========================================================================
  build-win64-obs30:
    name: "Windows 10/11 / OBS 30+ (64-bit MSVC + Qt6 Dock)"
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Purge Strawberry Perl from PATH
        shell: pwsh
        run: |
          # Strawberry Perl contains broken pkg-config.bat and ccache wrappers that break MSVC & Meson
          $cleanPath = ($env:PATH.Split(';') | Where-Object { $_ -and $_ -notlike '*Strawberry*' }) -join ';'
          "PATH=$cleanPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Meson and Ninja
        shell: pwsh
        run: |
          pip install meson ninja

      - name: Install Qt 6 (MSVC 64-bit)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.6.3'
          arch: 'win64_msvc2019_64'
          cache: true

      - name: Cache GStreamer MSVC SDK
        uses: actions/cache@v4
        with:
          path: C:\gstreamer\1.0\msvc_x86_64
          key: gstreamer-msvc-x86_64-v1.28.7-${{ hashFiles('**/build.yml') }}
          restore-keys: |
            gstreamer-msvc-x86_64-

      - name: Fetch and install GStreamer MSVC 64-bit SDK
        shell: pwsh
        run: |
          $gstRootTarget = "C:\gstreamer\1.0\msvc_x86_64"
          if (Test-Path "$gstRootTarget\lib\pkgconfig\gstreamer-1.0.pc") {
            Write-Host "GStreamer MSVC SDK already present (restored from cache or pre-installed)."
            $installed = $true
          } else {
            $targets = @(
              @{ Version = "1.28.7"; Retries = 2 },
              @{ Version = "1.26.6"; Retries = 1 }
            )
            $installed = $false

            foreach ($target in $targets) {
              $ver = $target.Version
              for ($attempt = 1; $attempt -le $target.Retries; $attempt++) {
                Write-Host "Trying GStreamer version $ver (Attempt $attempt of $($target.Retries))..."
                $gst_base = "https://gstreamer.freedesktop.org/data/pkg/windows/$ver/msvc"
                $exe_url = "$gst_base/gstreamer-1.0-msvc-x86_64-$ver.exe"

                if (Test-Path "gst-installer.exe") { Remove-Item "gst-installer.exe" -Force }
                if (Test-Path "gst-runtime.msi") { Remove-Item "gst-runtime.msi" -Force }
                if (Test-Path "gst-devel.msi") { Remove-Item "gst-devel.msi" -Force }

                # Try unified .exe
                try {
                  & curl.exe -fL --retry 2 --retry-delay 2 -o "gst-installer.exe" "$exe_url"
                  if ($LASTEXITCODE -eq 0 -and (Test-Path "gst-installer.exe")) {
                    $size = (Get-Item "gst-installer.exe").Length
                    if ($size -gt 400000000) {
                      $installerPath = (Get-Item "gst-installer.exe").FullName
                      $p = Start-Process -FilePath $installerPath -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP- /TYPE=devel /DIR=`"$gstRootTarget`" /LOG=`"gst-install.log`"" -Wait -PassThru
                      if ($p.ExitCode -eq 0) {
                        $installed = $true
                        break
                      }
                    }
                  }
                } catch {
                  Write-Host "Unified .exe attempt failed: $_"
                }

                # Fallback to separate MSIs
                $runtime_url = "$gst_base/gstreamer-1.0-msvc-x86_64-$ver.msi"
                $devel_url = "$gst_base/gstreamer-1.0-devel-msvc-x86_64-$ver.msi"
                try {
                  & curl.exe -fL --retry 2 --retry-delay 2 -o "gst-runtime.msi" "$runtime_url"
                  & curl.exe -fL --retry 2 --retry-delay 2 -o "gst-devel.msi" "$devel_url"
                  if ((Test-Path "gst-runtime.msi") -and (Test-Path "gst-devel.msi")) {
                    $p1 = Start-Process msiexec.exe -ArgumentList "/i `"$((Get-Item "gst-runtime.msi").FullName)`" ADDLOCAL=ALL /qn /norestart" -Wait -PassThru
                    $p2 = Start-Process msiexec.exe -ArgumentList "/i `"$((Get-Item "gst-devel.msi").FullName)`" ADDLOCAL=ALL /qn /norestart" -Wait -PassThru
                    if (($p1.ExitCode -eq 0 -or $p1.ExitCode -eq 3010) -and ($p2.ExitCode -eq 0 -or $p2.ExitCode -eq 3010)) {
                      $installed = $true
                      break
                    }
                  }
                } catch {
                  Write-Host "MSI attempt failed for ${ver}: $_"
                }
              }
              if ($installed) { break }
            }
          }

          if (-not $installed -and -not (Test-Path "$gstRootTarget\lib\pkgconfig\gstreamer-1.0.pc")) {
            Write-Host "Freedesktop.org downloads failed. Falling back to vcpkg..."
            Remove-Item Env:\VCPKG_ROOT -ErrorAction SilentlyContinue
            & C:\vcpkg\vcpkg.exe install gstreamer[plugins-base,plugins-good,plugins-bad,plugins-ugly,rtsp-server,webrtc]:x64-windows --triplet x64-windows
            if ($LASTEXITCODE -eq 0 -and (Test-Path "C:\vcpkg\installed\x64-windows\lib\pkgconfig\gstreamer-1.0.pc")) {
              $gstRootTarget = "C:\vcpkg\installed\x64-windows"
              $installed = $true
            }
          }

          if (-not $installed -and -not (Test-Path "$gstRootTarget\lib\pkgconfig\gstreamer-1.0.pc")) {
            Write-Error "Failed to download and install GStreamer across all attempted versions, MSIs, and vcpkg."
            exit 1
          }

          $gstRoot = $gstRootTarget
          Write-Host "Found GStreamer MSVC SDK at: $gstRoot"
          "GSTREAMER_ROOT=$gstRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "$gstRoot\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          if (Test-Path "$gstRoot\bin\pkg-config.exe") {
            "PKG_CONFIG=$gstRoot\bin\pkg-config.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }

      - name: Fetch and prepare OBS Studio 32.2.2 (x64) SDK
        shell: pwsh
        run: |
          $obs_version = "32.2.2"
          New-Item -ItemType Directory -Force -Path "obs-sdk\include\obs" | Out-Null
          New-Item -ItemType Directory -Force -Path "obs-sdk\lib\pkgconfig" | Out-Null

          $bin_url = "https://github.com/obsproject/obs-studio/releases/download/$obs_version/OBS-Studio-$obs_version-Windows-x64.zip"
          Write-Host "Downloading OBS Studio $obs_version Windows binary from $bin_url..."
          & curl.exe -fL --retry 3 --retry-delay 2 --retry-all-errors -C - -o "obs-bin.zip" "$bin_url"
          if ($LASTEXITCODE -ne 0 -or !(Test-Path "obs-bin.zip")) {
            Write-Error "Failed to download OBS Studio $obs_version Windows binary."
            exit 1
          }

          Expand-Archive -Path "obs-bin.zip" -DestinationPath "obs-bin"

          Write-Host "Downloading OBS Studio $obs_version source headers..."
          & curl.exe -fL --retry 3 --retry-delay 2 --retry-all-errors -C - -o "obs-src.zip" "https://github.com/obsproject/obs-studio/archive/refs/tags/$obs_version.zip"
          if ($LASTEXITCODE -ne 0 -or !(Test-Path "obs-src.zip")) {
            Write-Error "Failed to download OBS Studio $obs_version source archive."
            exit 1
          }
          Expand-Archive -Path "obs-src.zip" -DestinationPath "obs-src"

          # Provide headers
          Copy-Item -Recurse -Force "obs-src\obs-studio-$obs_version\libobs\*" "obs-sdk\include\obs\"
          Copy-Item -Recurse -Force "obs-src\obs-studio-$obs_version\libobs\*" "obs-sdk\include\"
          if (Test-Path "obs-src\obs-studio-$obs_version\frontend\api") {
            Copy-Item -Recurse -Force "obs-src\obs-studio-$obs_version\frontend\api\*" "obs-sdk\include\obs\"
            Copy-Item -Recurse -Force "obs-src\obs-studio-$obs_version\frontend\api\*" "obs-sdk\include\"
          }

          # Generate obsconfig.h (normally produced by CMake build for OBS 28+)
          $obsConfigLines = @(
            '#pragma once',
            '#ifndef OBS_INSTALL_PREFIX',
            '#define OBS_INSTALL_PREFIX ""',
            '#endif',
            '#ifndef OBS_DATA_PATH',
            '#define OBS_DATA_PATH "data"',
            '#endif',
            '#ifndef OBS_PLUGIN_PATH',
            '#define OBS_PLUGIN_PATH "obs-plugins/64bit"',
            '#endif',
            '#ifndef OBS_PLUGIN_DESTINATION',
            '#define OBS_PLUGIN_DESTINATION "obs-plugins/64bit"',
            '#endif',
            '#ifndef OBS_RELEASE_CANDIDATE',
            '#define OBS_RELEASE_CANDIDATE 0',
            '#endif',
            '#ifndef OBS_BETA',
            '#define OBS_BETA 0',
            '#endif'
          )
          $obsConfigLines | Out-File -FilePath "obs-sdk\include\obs\obsconfig.h" -Encoding ascii
          $obsConfigLines | Out-File -FilePath "obs-sdk\include\obsconfig.h" -Encoding ascii

          # Generate MSVC import library for obs.dll
          "EXPORTS" | Out-File -FilePath "obs.def" -Encoding ascii
          dumpbin /exports "obs-bin\bin\64bit\obs.dll" | Select-String -Pattern '^\s+\d+\s+[0-9A-Fa-f]+\s+[0-9A-Fa-f]+\s+(\S+)' | ForEach-Object { $_.Matches[0].Groups[1].Value } | Out-File -FilePath "obs.def" -Append -Encoding ascii
          lib /def:obs.def /machine:x64 /out:"obs-sdk\lib\obs.lib"

          # Generate MSVC import library for obs-frontend-api.dll
          "EXPORTS" | Out-File -FilePath "obs-frontend-api.def" -Encoding ascii
          dumpbin /exports "obs-bin\bin\64bit\obs-frontend-api.dll" | Select-String -Pattern '^\s+\d+\s+[0-9A-Fa-f]+\s+[0-9A-Fa-f]+\s+(\S+)' | ForEach-Object { $_.Matches[0].Groups[1].Value } | Out-File -FilePath "obs-frontend-api.def" -Append -Encoding ascii
          lib /def:obs-frontend-api.def /machine:x64 /out:"obs-sdk\lib\obs-frontend-api.lib"

          # Generate pkg-config files with forward slashes for Meson
          $sdkPath = (Get-Item "obs-sdk").FullName.Replace("\", "/")

          $libobsLines = @(
              "prefix=" + $sdkPath,
              "libdir=`${prefix}/lib",
              "includedir=`${prefix}/include",
              "",
              "Name: libobs",
              "Description: OBS Studio library",
              "Version: $obs_version",
              "Libs: -L`${libdir} -lobs",
              "Cflags: -I`${includedir} -I`${includedir}/obs"
          )
          $libobsLines | Out-File -FilePath "obs-sdk\lib\pkgconfig\libobs.pc" -Encoding ascii

          $frontendLines = @(
              "prefix=" + $sdkPath,
              "libdir=`${prefix}/lib",
              "includedir=`${prefix}/include",
              "",
              "Name: obs-frontend-api",
              "Description: OBS Studio Frontend API library",
              "Version: $obs_version",
              "Libs: -L`${libdir} -lobs-frontend-api",
              "Cflags: -I`${includedir} -I`${includedir}/obs"
          )
          $frontendLines | Out-File -FilePath "obs-sdk\lib\pkgconfig\obs-frontend-api.pc" -Encoding ascii

      - name: Configure and Compile with Meson and Ninja (MSVC + Qt6 Dock)
        shell: pwsh
        run: |
          # 1. Resolve GStreamer root and pkgconfig directory
          $gstSearchList = @(
            $env:GSTREAMER_ROOT,
            "C:\gstreamer\1.0\msvc_x86_64",
            "C:\Program Files\gstreamer\1.0\msvc_x86_64",
            [System.Environment]::GetEnvironmentVariable("GSTREAMER_1_0_ROOT_MSVC_X86_64", "Machine"),
            [System.Environment]::GetEnvironmentVariable("GSTREAMER_1_0_ROOT_MSVC_X86_64", "User")
          )
          $gstRoot = $null
          $gstPkgPath = $null

          foreach ($loc in $gstSearchList) {
            if ($loc -and (Test-Path "$loc\lib\pkgconfig\gstreamer-1.0.pc")) {
              $gstRoot = $loc.ToString().TrimEnd('\', '/')
              $gstPkgPath = "$gstRoot\lib\pkgconfig"
              break
            }
          }

          if (!$gstRoot) {
            Write-Host "Locating gstreamer-1.0.pc across drives..."
            $foundPc = Get-ChildItem -Path "C:\", "D:\" -Filter "gstreamer-1.0.pc" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($foundPc) {
              $gstPkgPath = $foundPc.DirectoryName
              $gstRoot = (Get-Item "$gstPkgPath\..\..").FullName.TrimEnd('\', '/')
            } else {
              Write-Error "gstreamer-1.0.pc could not be located anywhere on the filesystem!"
              exit 1
            }
          }

          Write-Host "Resolved GStreamer Root: $gstRoot"
          Write-Host "Resolved GStreamer PKG_CONFIG directory: $gstPkgPath"

          # 2. Resolve pkg-config binary
          if (Test-Path "$gstRoot\bin\pkg-config.exe") {
            $pkgExe = "$gstRoot\bin\pkg-config.exe"
          } elseif (Get-Command "pkg-config.exe" -ErrorAction SilentlyContinue) {
            $pkgExe = (Get-Command "pkg-config.exe").Source
          } else {
            $pkgExe = "C:\ProgramData\chocolatey\bin\pkg-config.exe"
          }
          $env:PKG_CONFIG = $pkgExe
          Write-Host "Using PKG_CONFIG binary: $env:PKG_CONFIG"

          $sdkFullPath = (Get-Item "obs-sdk").FullName
          $sdkPkgPath = (Get-Item "obs-sdk\lib\pkgconfig").FullName
          $sdkPkgFwd = $sdkPkgPath.Replace('\', '/')
          $gstPkgFwd = $gstPkgPath.Replace('\', '/')

          # Add directories to PATH, PKG_CONFIG_PATH, INCLUDE, and LIB
          $env:PATH = "$gstRoot\bin;$($env:QTDIR)\bin;C:\ProgramData\chocolatey\bin;$env:PATH"
          $env:PKG_CONFIG_PATH = "$sdkPkgPath;$gstPkgPath;$sdkPkgFwd;$gstPkgFwd"
          $env:INCLUDE = "$sdkFullPath\include;$sdkFullPath\include\obs;$gstRoot\include\gstreamer-1.0;$gstRoot\lib\gstreamer-1.0\include;$env:INCLUDE"
          $env:LIB = "$sdkFullPath\lib;$gstRoot\lib;$env:LIB"

          Write-Host "Verifying pkg-config resolution..."
          & $env:PKG_CONFIG --version
          & $env:PKG_CONFIG --modversion gstreamer-1.0

          $sdkIncludeFwd = $sdkFullPath.Replace('\', '/')
          $qtFwd = if ($env:QTDIR) { $env:QTDIR.Replace('\', '/') } else { "" }
          $qtArgs = if ($qtFwd) { "-I$qtFwd/include -I$qtFwd/include/QtCore -I$qtFwd/include/QtGui -I$qtFwd/include/QtWidgets" } else { "" }

          meson setup build-win64 `
            --buildtype release `
            -Dcpp_std=c++17 `
            -Dwebrtc=disabled `
            -Dpkg_config_path="$sdkPkgFwd,$gstPkgFwd" `
            -Dc_args="-I$sdkIncludeFwd/include -I$sdkIncludeFwd/include/obs" `
            -Dcpp_args="-I$sdkIncludeFwd/include -I$sdkIncludeFwd/include/obs $qtArgs"
          ninja -C build-win64

      - name: Package OBS 30+ (64-bit Win10/11) Release Archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "package-win64\obs-plugins\64bit" | Out-Null
          Copy-Item "build-win64\obs-gstreamer.dll" "package-win64\obs-plugins\64bit\"
          Copy-Item "docs\README-INSTALL-OBS30-WIN64.txt" "package-win64\README-INSTALL.txt"

          Compress-Archive -Path "package-win64\*" -DestinationPath "obs-gstreamer-obs30-win64.zip" -Force

      - name: Upload Win64 (OBS 30+) Artifact
        uses: actions/upload-artifact@v4
        with:
          name: obs-gstreamer-obs30-win64
          path: obs-gstreamer-obs30-win64.zip

  # =========================================================================
  # Target 2: Linux (x86_64) Native (Latest OBS Studio 30+)
  # =========================================================================
  build-linux:
    name: "Linux (64-bit x86_64, OBS 30+)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (Latest OBS 30+ & GStreamer)
        run: |
          sudo add-apt-repository -y ppa:obsproject/obs-studio
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ninja-build python3-pip pkg-config \
            libobs-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev libgstrtspserver-1.0-dev \
            libsoup-3.0-dev qt6-base-dev qtbase5-dev
          pip3 install --upgrade meson

      - name: Build with Meson
        run: |
          meson setup build-linux --buildtype release -Dc_args="-I/usr/include/obs" -Dcpp_args="-I/usr/include/obs"
          ninja -C build-linux

      - name: Package Linux Plugin
        run: |
          mkdir -p package-linux/bin/64bit
          cp build-linux/obs-gstreamer.so package-linux/bin/64bit/
          tar -czf obs-gstreamer-linux-x86_64.tar.gz -C package-linux .

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: obs-gstreamer-linux-x86_64
          path: obs-gstreamer-linux-x86_64.tar.gz

  # =========================================================================
  # Publish GitHub Release when tagged
  # =========================================================================
  release:
    name: "Publish GitHub Release"
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-win64-obs30, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4

      - name: Create Release and attach separate packages
        uses: softprops/action-gh-release@v2
        with:
          files: |
            obs-gstreamer-obs30-win64/obs-gstreamer-obs30-win64.zip
            obs-gstreamer-linux-x86_64/obs-gstreamer-linux-x86_64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
