name: Build obs-gstreamer (Multi-Target Separate Outputs)

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  # =========================================================================
  # Target 1: Legacy OBS 27.2.4 (32-bit x86) for Windows 7 SP1 / Ivy Bridge
  # =========================================================================
  build-win32-obs27:
    name: "Windows 7 / OBS 27 (32-bit x86)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build prerequisites & MinGW-w64 i686
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-mingw-w64-i686 g++-mingw-w64-i686 mingw-w64-tools \
            ninja-build python3-pip msitools wget unzip pkg-config
          pip3 install --upgrade meson

      - name: Fetch and prepare OBS Studio 27.2.4 (x86) SDK
        run: |
          mkdir -p obs-sdk-win32/include/obs
          mkdir -p obs-sdk-win32/lib/pkgconfig
          cd obs-sdk-win32
          wget -q https://github.com/obsproject/obs-studio/releases/download/27.2.4/OBS-Studio-27.2.4-Full-x86.zip
          unzip -q -o OBS-Studio-27.2.4-Full-x86.zip "bin/32bit/*"
          wget -q https://github.com/obsproject/obs-studio/archive/refs/tags/27.2.4.tar.gz
          tar -xzf 27.2.4.tar.gz
          
          # Provide headers in both include/obs/ and include/
          cp -r obs-studio-27.2.4/libobs/* include/obs/
          cp -r obs-studio-27.2.4/UI/obs-frontend-api/* include/obs/
          cp -r obs-studio-27.2.4/libobs/* include/
          cp -r obs-studio-27.2.4/UI/obs-frontend-api/* include/

          # Generate obsconfig.h (normally produced by CMake build)
          (
            echo '#pragma once'
            echo '#ifndef OBS_INSTALL_PREFIX'
            echo '#define OBS_INSTALL_PREFIX ""'
            echo '#endif'
            echo '#ifndef OBS_DATA_PATH'
            echo '#define OBS_DATA_PATH "data"'
            echo '#endif'
            echo '#ifndef OBS_PLUGIN_DESTINATION'
            echo '#define OBS_PLUGIN_DESTINATION "obs-plugins"'
            echo '#endif'
            echo '#ifndef OBS_RELEASE_CANDIDATE'
            echo '#define OBS_RELEASE_CANDIDATE 0'
            echo '#endif'
            echo '#ifndef OBS_BETA'
            echo '#define OBS_BETA 0'
            echo '#endif'
          ) > include/obs/obsconfig.h
          cp include/obs/obsconfig.h include/obsconfig.h
          
          # Generate MinGW import libraries from 32-bit OBS binaries
          gendef bin/32bit/obs.dll
          i686-w64-mingw32-dlltool -d obs.def -l libobs.dll.a -D obs.dll
          gendef bin/32bit/obs-frontend-api.dll
          i686-w64-mingw32-dlltool -d obs-frontend-api.def -l libobs-frontend-api.dll.a -D obs-frontend-api.dll

          SDK_DIR="$(pwd)"
          printf "prefix=%s\nlibdir=%s\nincludedir=%s/include\n\nName: libobs\nDescription: OBS Studio library\nVersion: 27.2.4\nLibs: -L\${libdir} -lobs\nCflags: -I\${includedir}\n" "$SDK_DIR" "$SDK_DIR" "$SDK_DIR" > lib/pkgconfig/libobs.pc
          printf "prefix=%s\nlibdir=%s\nincludedir=%s/include\n\nName: obs-frontend-api\nDescription: OBS Studio Frontend API library\nVersion: 27.2.4\nLibs: -L\${libdir} -lobs-frontend-api\nCflags: -I\${includedir}\n" "$SDK_DIR" "$SDK_DIR" "$SDK_DIR" > lib/pkgconfig/obs-frontend-api.pc
          cd ..

      - name: Fetch and prepare GStreamer (x86) MinGW SDK
        run: |
          mkdir -p gst-sdk-win32
          cd gst-sdk-win32
          GST_URL="https://gstreamer.freedesktop.org/data/pkg/windows/1.18.6/mingw/gstreamer-1.0-devel-mingw-x86-1.18.6.msi"
          wget -q "$GST_URL" -O gst-devel.msi || wget -q https://gstreamer.freedesktop.org/data/pkg/windows/1.20.7/mingw/gstreamer-1.0-devel-mingw-x86-1.20.7.msi -O gst-devel.msi
          msiextract gst-devel.msi
          
          # Normalize pkg-config paths to current extracted location
          GST_ROOT="$(pwd)/gstreamer/1.0/mingw_x86"
          sed -i.bak "s|^prefix=.*|prefix=${GST_ROOT}|g" "${GST_ROOT}/lib/pkgconfig/"*.pc
          cd ..

      - name: Configure Meson build (32-bit x86, Win7 SP1 target)
        run: |
          export PKG_CONFIG_PATH="$(pwd)/obs-sdk-win32/lib/pkgconfig:$(pwd)/gst-sdk-win32/gstreamer/1.0/mingw_x86/lib/pkgconfig"
          export PKG_CONFIG_LIBDIR="${PKG_CONFIG_PATH}"
          
          meson setup build-win32 \
            --cross-file cross/i686-w64-mingw32.ini \
            --buildtype release \
            -Dwebrtc=disabled

      - name: Compile 32-bit Plugin
        run: |
          ninja -C build-win32

      - name: Package OBS 27 (32-bit Win7) Release Archive
        run: |
          mkdir -p package-win32/obs-plugins/32bit
          cp build-win32/obs-gstreamer.dll package-win32/obs-plugins/32bit/
          cp docs/README-INSTALL-OBS27-WIN32.txt package-win32/README-INSTALL.txt
          
          cd package-win32
          zip -r ../obs-gstreamer-obs27-win32.zip ./*
          cd ..

      - name: Upload Win32 (OBS 27) Artifact
        uses: actions/upload-artifact@v4
        with:
          name: obs-gstreamer-obs27-win32
          path: obs-gstreamer-obs27-win32.zip

  # =========================================================================
  # Target 2: Modern OBS Studio 30+/32+ (64-bit x64) for Windows 10/11
  # Native MSVC + Qt 6 Build (Enables Native Qt6 Dock in OBS Studio Menu)
  # =========================================================================
  build-win64-obs30:
    name: "Windows 10/11 / OBS 32+ (64-bit MSVC + Qt6 Dock)"
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Purge Strawberry Perl from PATH
        shell: pwsh
        run: |
          # Strawberry Perl contains broken pkg-config.bat and ccache wrappers that break MSVC & Meson
          $cleanPath = ($env:PATH.Split(';') | Where-Object { $_ -and $_ -notlike '*Strawberry*' }) -join ';'
          "PATH=$cleanPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Meson, Ninja, and pkg-config
        shell: pwsh
        run: |
          pip install meson ninja
          choco install pkgconfiglite -y

      - name: Install Qt 6 (MSVC 64-bit)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.6.3'
          arch: 'win64_msvc2019_64'
          cache: true

      - name: Fetch and install GStreamer MSVC 64-bit SDK
        shell: pwsh
        run: |
          $gst_version = "1.28.7"
          $gst_base = "https://gstreamer.freedesktop.org/data/pkg/windows/$gst_version/msvc"
          $exe_url = "$gst_base/gstreamer-1.0-msvc-x86_64-$gst_version.exe"
          $runtime_url = "$gst_base/gstreamer-1.0-msvc-x86_64-$gst_version.msi"
          $devel_url = "$gst_base/gstreamer-1.0-devel-msvc-x86_64-$gst_version.msi"

          # Determine installer format: GStreamer 1.28+ distributes a unified Inno Setup .exe (runtime + devel),
          # whereas 1.26 and earlier distributed separate .msi packages.
          $hasExe = $false
          try {
            $resp = Invoke-WebRequest -Uri $exe_url -Method Head -UseBasicParsing -ErrorAction Stop
            if ($resp.StatusCode -eq 200) {
              $hasExe = $true
            }
          } catch {
            $hasExe = $false
          }

          if ($hasExe) {
            Write-Host "Downloading GStreamer MSVC unified installer ($gst_version)..."
            Invoke-WebRequest -Uri $exe_url -OutFile "gst-installer.exe"
            $installerPath = (Get-Item "gst-installer.exe").FullName

            Write-Host "Installing GStreamer MSVC (Runtime + Devel)..."
            $p = Start-Process -FilePath $installerPath -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP- /TYPE=devel /DIR=`"C:\gstreamer\1.0\msvc_x86_64`" /LOG=`"gst-install.log`"" -Wait -PassThru
            if ($p.ExitCode -ne 0) {
              if (Test-Path "gst-install.log") {
                Write-Host "Installer log tail:"
                Get-Content "gst-install.log" | Select-Object -Last 50
              }
              Write-Error "GStreamer Inno installer failed with exit code $($p.ExitCode)"
              exit 1
            }
          } else {
            Write-Host "Downloading GStreamer MSVC Runtime ($gst_version)..."
            Invoke-WebRequest -Uri $runtime_url -OutFile "gst-runtime.msi"
            Write-Host "Downloading GStreamer MSVC Devel SDK ($gst_version)..."
            Invoke-WebRequest -Uri $devel_url -OutFile "gst-devel.msi"

            $runtimeMsi = (Get-Item "gst-runtime.msi").FullName
            $develMsi = (Get-Item "gst-devel.msi").FullName

            Write-Host "Installing GStreamer MSVC Runtime..."
            $p1 = Start-Process msiexec.exe -ArgumentList "/i `"$runtimeMsi`" ADDLOCAL=ALL /qn /norestart" -Wait -PassThru
            if ($p1.ExitCode -ne 0 -and $p1.ExitCode -ne 3010) {
              Write-Error "GStreamer runtime installer failed with exit code $($p1.ExitCode)"
              exit 1
            }

            Write-Host "Installing GStreamer MSVC Devel SDK..."
            $p2 = Start-Process msiexec.exe -ArgumentList "/i `"$develMsi`" ADDLOCAL=ALL /qn /norestart" -Wait -PassThru
            if ($p2.ExitCode -ne 0 -and $p2.ExitCode -ne 3010) {
              Write-Error "GStreamer devel installer failed with exit code $($p2.ExitCode)"
              exit 1
            }
          }

          # Refresh and detect GStreamer install directory
          $rawCandidates = @(
            "C:\gstreamer\1.0\msvc_x86_64",
            "C:\Program Files\gstreamer\1.0\msvc_x86_64",
            [System.Environment]::GetEnvironmentVariable("GSTREAMER_1_0_ROOT_MSVC_X86_64", "Machine"),
            [System.Environment]::GetEnvironmentVariable("GSTREAMER_1_0_ROOT_MSVC_X86_64", "User")
          )
          $foundRoot = $null
          foreach ($cand in $rawCandidates) {
            if ($cand -and ((Test-Path "$cand\bin\pkg-config.exe") -or (Test-Path "$cand\lib\pkgconfig\gstreamer-1.0.pc"))) {
              $foundRoot = $cand.ToString().TrimEnd('\', '/')
              break
            }
          }

          if (!$foundRoot) {
            Write-Host "Searching for gstreamer-1.0.pc across drives..."
            $foundPc = Get-ChildItem -Path "C:\", "D:\" -Filter "gstreamer-1.0.pc" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($foundPc) {
              $foundRoot = (Get-Item "$($foundPc.DirectoryName)\..\..").FullName.TrimEnd('\', '/')
            } else {
              Write-Error "GStreamer installation failed: gstreamer-1.0.pc not found anywhere on the filesystem."
              exit 1
            }
          }

          $gstRoot = $foundRoot
          Write-Host "Found GStreamer MSVC SDK at: $gstRoot"
          "GSTREAMER_ROOT=$gstRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "$gstRoot\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          if (Test-Path "$gstRoot\bin\pkg-config.exe") {
            "PKG_CONFIG=$gstRoot\bin\pkg-config.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }

      - name: Fetch and prepare OBS Studio 32.2.2 (x64) SDK
        shell: pwsh
        run: |
          $obs_version = "32.2.2"
          New-Item -ItemType Directory -Force -Path "obs-sdk\include\obs" | Out-Null
          New-Item -ItemType Directory -Force -Path "obs-sdk\lib\pkgconfig" | Out-Null

          # Support modern OBS 31/32+ asset naming (-Windows-x64.zip) and legacy OBS 30 (-Windows.zip)
          $bin_urls = @(
            "https://github.com/obsproject/obs-studio/releases/download/$obs_version/OBS-Studio-$obs_version-Windows-x64.zip",
            "https://github.com/obsproject/obs-studio/releases/download/$obs_version/OBS-Studio-$obs_version-Windows.zip"
          )
          $downloaded = $false
          foreach ($url in $bin_urls) {
            try {
              Write-Host "Downloading OBS Studio $obs_version Windows binary from $url..."
              Invoke-WebRequest -Uri $url -OutFile "obs-bin.zip" -UseBasicParsing -ErrorAction Stop
              $downloaded = $true
              break
            } catch {
              Write-Host "Candidate URL not found: $url"
            }
          }
          if (!$downloaded) {
            Write-Error "Failed to download OBS Studio $obs_version Windows binary from release assets."
            exit 1
          }

          Expand-Archive -Path "obs-bin.zip" -DestinationPath "obs-bin"

          Write-Host "Downloading OBS Studio $obs_version source headers..."
          Invoke-WebRequest -Uri "https://github.com/obsproject/obs-studio/archive/refs/tags/$obs_version.zip" -OutFile "obs-src.zip"
          Expand-Archive -Path "obs-src.zip" -DestinationPath "obs-src"

          # Provide headers (supports modern frontend/api and legacy UI/obs-frontend-api)
          Copy-Item -Recurse -Force "obs-src\obs-studio-$obs_version\libobs\*" "obs-sdk\include\obs\"
          Copy-Item -Recurse -Force "obs-src\obs-studio-$obs_version\libobs\*" "obs-sdk\include\"
          if (Test-Path "obs-src\obs-studio-$obs_version\frontend\api") {
            Copy-Item -Recurse -Force "obs-src\obs-studio-$obs_version\frontend\api\*" "obs-sdk\include\obs\"
            Copy-Item -Recurse -Force "obs-src\obs-studio-$obs_version\frontend\api\*" "obs-sdk\include\"
          }
          if (Test-Path "obs-src\obs-studio-$obs_version\UI\obs-frontend-api") {
            Copy-Item -Recurse -Force "obs-src\obs-studio-$obs_version\UI\obs-frontend-api\*" "obs-sdk\include\obs\"
            Copy-Item -Recurse -Force "obs-src\obs-studio-$obs_version\UI\obs-frontend-api\*" "obs-sdk\include\"
          }

          # Generate obsconfig.h (normally produced by CMake build for OBS 28+)
          $obsConfigLines = @(
            '#pragma once',
            '#ifndef OBS_INSTALL_PREFIX',
            '#define OBS_INSTALL_PREFIX ""',
            '#endif',
            '#ifndef OBS_DATA_PATH',
            '#define OBS_DATA_PATH "data"',
            '#endif',
            '#ifndef OBS_PLUGIN_PATH',
            '#define OBS_PLUGIN_PATH "obs-plugins/64bit"',
            '#endif',
            '#ifndef OBS_PLUGIN_DESTINATION',
            '#define OBS_PLUGIN_DESTINATION "obs-plugins/64bit"',
            '#endif',
            '#ifndef OBS_RELEASE_CANDIDATE',
            '#define OBS_RELEASE_CANDIDATE 0',
            '#endif',
            '#ifndef OBS_BETA',
            '#define OBS_BETA 0',
            '#endif'
          )
          $obsConfigLines | Out-File -FilePath "obs-sdk\include\obs\obsconfig.h" -Encoding ascii
          $obsConfigLines | Out-File -FilePath "obs-sdk\include\obsconfig.h" -Encoding ascii

          # Generate MSVC import library for obs.dll
          "EXPORTS" | Out-File -FilePath "obs.def" -Encoding ascii
          dumpbin /exports "obs-bin\bin\64bit\obs.dll" | Select-String -Pattern '^\s+\d+\s+[0-9A-Fa-f]+\s+[0-9A-Fa-f]+\s+(\S+)' | ForEach-Object { $_.Matches[0].Groups[1].Value } | Out-File -FilePath "obs.def" -Append -Encoding ascii
          lib /def:obs.def /machine:x64 /out:"obs-sdk\lib\obs.lib"

          # Generate MSVC import library for obs-frontend-api.dll
          "EXPORTS" | Out-File -FilePath "obs-frontend-api.def" -Encoding ascii
          dumpbin /exports "obs-bin\bin\64bit\obs-frontend-api.dll" | Select-String -Pattern '^\s+\d+\s+[0-9A-Fa-f]+\s+[0-9A-Fa-f]+\s+(\S+)' | ForEach-Object { $_.Matches[0].Groups[1].Value } | Out-File -FilePath "obs-frontend-api.def" -Append -Encoding ascii
          lib /def:obs-frontend-api.def /machine:x64 /out:"obs-sdk\lib\obs-frontend-api.lib"

          # Generate pkg-config files with forward slashes for Meson
          $sdkPath = (Get-Item "obs-sdk").FullName.Replace("\", "/")

          $libobsLines = @(
              "prefix=" + $sdkPath,
              "libdir=`${prefix}/lib",
              "includedir=`${prefix}/include",
              "",
              "Name: libobs",
              "Description: OBS Studio library",
              "Version: $obs_version",
              "Libs: -L`${libdir} -lobs",
              "Cflags: -I`${includedir} -I`${includedir}/obs"
          )
          $libobsLines | Out-File -FilePath "obs-sdk\lib\pkgconfig\libobs.pc" -Encoding ascii

          $frontendLines = @(
              "prefix=" + $sdkPath,
              "libdir=`${prefix}/lib",
              "includedir=`${prefix}/include",
              "",
              "Name: obs-frontend-api",
              "Description: OBS Studio Frontend API library",
              "Version: $obs_version",
              "Libs: -L`${libdir} -lobs-frontend-api",
              "Cflags: -I`${includedir} -I`${includedir}/obs"
          )
          $frontendLines | Out-File -FilePath "obs-sdk\lib\pkgconfig\obs-frontend-api.pc" -Encoding ascii

      - name: Configure and Compile with Meson and Ninja (MSVC + Qt6 Dock)
        shell: pwsh
        run: |
          # 1. Resolve GStreamer root and pkgconfig directory
          $gstSearchList = @(
            $env:GSTREAMER_ROOT,
            "C:\gstreamer\1.0\msvc_x86_64",
            "C:\Program Files\gstreamer\1.0\msvc_x86_64",
            "C:\Program Files (x86)\gstreamer\1.0\msvc_x86_64",
            [System.Environment]::GetEnvironmentVariable("GSTREAMER_1_0_ROOT_MSVC_X86_64", "Machine"),
            [System.Environment]::GetEnvironmentVariable("GSTREAMER_1_0_ROOT_MSVC_X86_64", "User")
          )
          $gstRoot = $null
          $gstPkgPath = $null

          foreach ($loc in $gstSearchList) {
            if ($loc -and (Test-Path "$loc\lib\pkgconfig\gstreamer-1.0.pc")) {
              $gstRoot = $loc.ToString().TrimEnd('\', '/')
              $gstPkgPath = "$gstRoot\lib\pkgconfig"
              break
            }
          }

          if (!$gstRoot) {
            Write-Host "Locating gstreamer-1.0.pc across drives..."
            $foundPc = Get-ChildItem -Path "C:\", "D:\" -Filter "gstreamer-1.0.pc" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($foundPc) {
              $gstPkgPath = $foundPc.DirectoryName
              $gstRoot = (Get-Item "$gstPkgPath\..\..").FullName.TrimEnd('\', '/')
            } else {
              Write-Error "gstreamer-1.0.pc could not be located anywhere on the filesystem!"
              exit 1
            }
          }

          Write-Host "Resolved GStreamer Root: $gstRoot"
          Write-Host "Resolved GStreamer PKG_CONFIG directory: $gstPkgPath"

          # 2. Resolve pkg-config binary
          if (Test-Path "$gstRoot\bin\pkg-config.exe") {
            $pkgExe = "$gstRoot\bin\pkg-config.exe"
          } elseif (Get-Command "pkg-config.exe" -ErrorAction SilentlyContinue) {
            $pkgExe = (Get-Command "pkg-config.exe").Source
          } else {
            $pkgExe = "C:\ProgramData\chocolatey\bin\pkg-config.exe"
          }
          $env:PKG_CONFIG = $pkgExe
          Write-Host "Using PKG_CONFIG binary: $env:PKG_CONFIG"

          $sdkFullPath = (Get-Item "obs-sdk").FullName
          $sdkPkgPath = (Get-Item "obs-sdk\lib\pkgconfig").FullName
          $sdkPkgFwd = $sdkPkgPath.Replace('\', '/')
          $gstPkgFwd = $gstPkgPath.Replace('\', '/')

          # Add directories to PATH, PKG_CONFIG_PATH, INCLUDE, and LIB
          $env:PATH = "$gstRoot\bin;$($env:QTDIR)\bin;C:\ProgramData\chocolatey\bin;$env:PATH"
          $env:PKG_CONFIG_PATH = "$sdkPkgPath;$gstPkgPath;$sdkPkgFwd;$gstPkgFwd"
          $env:INCLUDE = "$sdkFullPath\include;$sdkFullPath\include\obs;$gstRoot\include\gstreamer-1.0;$gstRoot\lib\gstreamer-1.0\include;$env:INCLUDE"
          $env:LIB = "$sdkFullPath\lib;$gstRoot\lib;$env:LIB"

          Write-Host "Verifying pkg-config resolution..."
          & $env:PKG_CONFIG --version
          & $env:PKG_CONFIG --modversion gstreamer-1.0

          $sdkIncludeFwd = $sdkFullPath.Replace('\', '/')
          $qtFwd = if ($env:QTDIR) { $env:QTDIR.Replace('\', '/') } else { "" }
          $qtArgs = if ($qtFwd) { "-I$qtFwd/include -I$qtFwd/include/QtCore -I$qtFwd/include/QtGui -I$qtFwd/include/QtWidgets" } else { "" }

          meson setup build-win64 `
            --buildtype release `
            -Dcpp_std=c++17 `
            -Dwebrtc=disabled `
            -Dpkg_config_path="$sdkPkgFwd,$gstPkgFwd" `
            -Dc_args="-I$sdkIncludeFwd/include -I$sdkIncludeFwd/include/obs" `
            -Dcpp_args="-I$sdkIncludeFwd/include -I$sdkIncludeFwd/include/obs $qtArgs"
          ninja -C build-win64

      - name: Package OBS 30+ (64-bit Win10/11) Release Archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "package-win64\obs-plugins\64bit" | Out-Null
          Copy-Item "build-win64\obs-gstreamer.dll" "package-win64\obs-plugins\64bit\"
          Copy-Item "docs\README-INSTALL-OBS30-WIN64.txt" "package-win64\README-INSTALL.txt"

          Compress-Archive -Path "package-win64\*" -DestinationPath "obs-gstreamer-obs30-win64.zip" -Force

      - name: Upload Win64 (OBS 30+) Artifact
        uses: actions/upload-artifact@v4
        with:
          name: obs-gstreamer-obs30-win64
          path: obs-gstreamer-obs30-win64.zip

  # =========================================================================
  # Target 3: Linux (x86_64) Native (Latest OBS Studio 30+)
  # =========================================================================
  build-linux:
    name: "Linux (64-bit x86_64, OBS 30+)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (Latest OBS 30+ & GStreamer)
        run: |
          sudo add-apt-repository -y ppa:obsproject/obs-studio
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ninja-build python3-pip pkg-config \
            libobs-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev libgstrtspserver-1.0-dev \
            libsoup-3.0-dev qt6-base-dev qtbase5-dev
          pip3 install --upgrade meson

      - name: Build with Meson
        run: |
          meson setup build-linux --buildtype release -Dc_args="-I/usr/include/obs" -Dcpp_args="-I/usr/include/obs"
          ninja -C build-linux

      - name: Package Linux Plugin
        run: |
          mkdir -p package-linux/bin/64bit
          cp build-linux/obs-gstreamer.so package-linux/bin/64bit/
          tar -czf obs-gstreamer-linux-x86_64.tar.gz -C package-linux .

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: obs-gstreamer-linux-x86_64
          path: obs-gstreamer-linux-x86_64.tar.gz

  # =========================================================================
  # Optional: Publish GitHub Release when tagged
  # =========================================================================
  release:
    name: "Publish GitHub Release"
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-win32-obs27, build-win64-obs30, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4

      - name: Create Release and attach separate packages
        uses: softprops/action-gh-release@v2
        with:
          files: |
